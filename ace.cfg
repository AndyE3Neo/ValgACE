# Please check that [save_variables] is above [ace] if you're using different config

[ace]
serial: /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
# usb-ANYCUBIC_ACE_1-if00
baud: 115200
# Disable logging, default True
#disable_logging: False
#log_dir: ~/printer_1_data/logs
#Уровни логирования DEBUG - для отладочной информации INFO - для основных событий WARNING - для предупреждений ERROR - для ошибок
#log_level: INFO
# Max log size in Mb
#max_log_size: 10
# Old logs count
#log_backup_count: 3
# Some timeout for serial
response_timeout: 2.0
read_timeout: 0.1
write_timeout: 0.5
# Max queue size default 20 messages
max_queue_size: 20
# Default feeding speed, 10-25 in stock
feed_speed: 50
# Default retraction speed, 10-25 in stock
retract_speed: 50
# Length of the retract to make for toolchange
toolchange_retract_length: 800
# Park to toolhead hit count, default is 5, can be lowered if your setup works stably on lower values
park_hit_count: 10
# Max dryer temperature. If you want to fry your dryer, then you can! (Just joking, should be safe around ~60, but it's not tested yet)
max_dryer_temperature: 55
# Disables feed assist after toolchange. Defaults to true
disable_assist_after_toolchange: False
infinity_spool_mode: True
# Включаем альтернативный алгоритм
aggressive_parking: True
# === PARKING DISTANCE ===
# Distance for filament to reach the sensor/gears during parking
# With ~60cm of filament after sensor, we can extrude 50cm of old filament
# Set to ~500mm to safely handle both normal toolchange and infinity spool scenarios
max_parking_distance: 500
# Скорость для этой дистанции
parking_speed: 60
max_parking_timeout: 90
extended_park_time: 7

filament_sensor: btt_switch_sensor

[gcode_macro _ACE_INIT_VARS]
gcode:
    {% if printer.save_variables.variables.ace_last_loaded_slot is not defined %}
        SAVE_VARIABLE VARIABLE=ace_last_loaded_slot VALUE=-1
    {% endif %}

[gcode_macro _TIP_MAKER]
description: Making good filament tip
gcode:
        M83 ; Относительная экструзия
        G1 E10 F240    ; Медленно разгружаем давление сопла (набивка)
        G1 E-12 F2400  
        G1 E-10 F1200  
        G1 E3 F2400    ; Шаг вперед (срезаем наплыв)
        G1 E-5 F2400   ; Шаг назад (обрываем нить)
        G4 P200        ; Микро-пауза (0.2 сек) для окончательного затвердевания конуса

[gcode_macro _ACE_PRE_INFINITYSPOOL]
variable_purge_temp_min: 220
gcode:
    {% set from_index = params.FROM|default(-1)|int %}
    {% set to_index = params.TO|default(-1)|int %}
    
    M117 Infinity Spool Change (Slot {from_index} -> {to_index})
    M118 Spool empty. Blinding Kobra S1 sensors...

    # 1. Отключаем датчики, чтобы Klipper их не опрашивал на паузе
    SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=btt_switch_sensor ENABLE=0

    # 2. Сохраняем координаты
    SAVE_GCODE_STATE NAME=INFINITY_SPOOL_STATE
    
    # 3. Уводим голову в безопасную зону
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set park_x = client.custom_park_x | default(-15.0) %}
    {% set park_y = client.custom_park_y | default(-10.0) %}
    
    G91
    G1 Z5 F3000
    G90
    G1 X{park_x} Y{park_y} F8000

    # 4. Включаем паузу Klipper. Это переключит статус системы, и ValgACE разрешит подачу
    PAUSE_BASE


[gcode_macro _ACE_POST_INFINITYSPOOL]
gcode:
    
    {% set to_index = params.TO|default(-1)|int %}
    {% set purge_temp_min = printer["gcode_macro _ACE_PRE_INFINITYSPOOL"].purge_temp_min | default(220) | int %}
    
    M118 Activating feed assist for slot {to_index}...
    M104 S{purge_temp_min}

    # 1. Запускаем подачу из коробки ACE Pro
    ACE_ENABLE_FEED_ASSIST INDEX={to_index}
    
    # 2. Ждем, чтобы пластик долетел до обрубка
    G4 P10000 

    # 3. Синхронное силовое продавливание "паровозика" через экструдер
    M83 
    G92 E0
    M118 Pushing remnant (~100mm) through nozzle...
    G1 E100 F200 
    G92 E0
    M82

    M118 Push-through success. Re-enabling Kobra S1 sensors...

    # 4. Включаем обратно оптический концевик (он уже нажат новым пластиком)
    SET_FILAMENT_SENSOR SENSOR=btt_switch_sensor ENABLE=1

    # 5. Возвращаем голову на модель и возобновляем печать из состояния паузы
    RESTORE_GCODE_STATE NAME=INFINITY_SPOOL_STATE MOVE=1 MOVE_SPEED=200
    RESUME_BASE

    # 6. Даем принтеру проехать 1 секунду по модели и включаем датчик движения
    G4 S1 
    SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=1

[gcode_macro _ACE_PRE_TOOLCHANGE]
variable_purge_temp_min: 220
gcode:
    {% set from_index = params.FROM|default(printer.save_variables.variables.ace_last_loaded_slot|default(-1))|int %}
    {% if from_index == -1 %}
        {action_respond_info("ACE: No current slot, skipping pre-toolchange")}
        SAVE_GCODE_STATE NAME=TOOLCHANGE
    {% else %}
        {action_respond_info("ACE: Entering pre_toolchange for slot " ~ from_index|string)}
        SAVE_GCODE_STATE NAME=TOOLCHANGE
        
        # === ШАГ 1: ГАРАНТИРОВАННО СНИМАЕМ НАТЯЖЕНИЕ С АССИСТА ===
        ACE_DISABLE_FEED_ASSIST INDEX={from_index}
        {action_respond_info("ACE: Feed assist disabled for slot " ~ from_index|string)}
        
        # === АВТО-ХОМИНГ X Y ДЛЯ ТЕСТОВ (Решает ошибку Must home axis first) ===
        {% if printer.idle_timeout.state != "Printing" %}
            {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
                M118 Оси X/Y не отхомлены. Выполняю безопасный хоминг...
                G28 X Y
            {% endif %}
        {% endif %}
        {% if printer.idle_timeout.state == "Printing" %}
        # During print: nozzle already hot, just ensure target temp
        M109 S{printer.extruder.target_temp}
        {% else %}
            # Print finished: nozzle is cold, heat to safe temp (220°C)
            M109 S220
        {% endif %}
        # === ШАГ 2: БЕЗОПАСНОЕ ПЕРЕМЕЩЕНИЕ ===
        {% set x_min = printer.toolhead.axis_minimum.x %}
        {% set bed_start = 0 %}
        {% set safe_x = (x_min + bed_start) / 2 %}
        G90                  ; Абсолютные координаты для осей X/Y/Z
        G1 X{safe_x} F15000  ; Уводим голову в безопасную зону
        
        # === ШАГ 3: ФОРМИРОВАНИЕ КОНЧИКА И ВЫГРУЗКА ИЗ ГОЛОВЫ ===
        M83                  ; Относительный режим экструдера (защита для _TIP_MAKER)
        _TIP_MAKER           ; Выполняет формовку и вытягивает нить выше шестерен директа
        G92 E0
        
        # === ШАГ 4: СМОТКА ПРУТКА В КОРОБКУ ACE ===
        ACE_RETRACT INDEX={from_index} LENGTH=70 SPEED=30
        G4 P3000
        {action_respond_info("ACE: Retraction into spool complete")}
        
        G90                  ; Возвращаем абсолютные координаты для осей
        
        # === ШАГ 5: ДАТЧИКИ И ТАЙМАУТЫ ===
        {% if printer.filament_sensor is defined %}
            SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=0
            SET_FILAMENT_SENSOR SENSOR=btt_switch_sensor ENABLE=0
        {% endif %}
        SET_IDLE_TIMEOUT TIMEOUT=1800
    {% endif %}

[gcode_macro _ACE_POST_TOOLCHANGE]
gcode:
    {% if params.TO is defined %}
        # Сохраняем заданный слот
        {% set to_index = params.TO|int %}
        {% set spool_num = to_index + 1 if to_index != -1 else -1 %}
        {% set currently_in_head = printer.save_variables.variables.ace_last_loaded_slot|default(-1)|int %}
        
        {% if to_index != -1 %}
            {% if to_index == currently_in_head %}
                {action_respond_info("ЗАЩИТА: Этот слот уже находится в голове принтера по данным памяти! Подача заблокирована во избежание вылета трубки.")}
                M117 Spool already active!
            {% else %}
                M118 Enabling feed for SPOOL {spool_num}.
                
                # === 1. СНАЧАЛА ВКЛЮЧАЕМ ПОДАЧУ ИЗ КОРОБКИ ACE ===
                ACE_ENABLE_FEED_ASSIST INDEX={to_index}
                
                # === 2. ДЕЛАЕМ ПАУЗУ ИЛИ СИНХРОННУЮ ПОДАЧУ ===
                # Даем команду экструдеру головы подхватить филамент, приходящий из ACE
                M83              ; Относительный режим для экструдера
                G4 P5000
                G1 E30 F150      ; Медленный подхват филамента в экструдер
                G1 E50 F600      ; Продавливание пластика в сопло (очистка от старого цвета)
                G92 E0           ; Сброс счетчика экструдера
                
                # === 3. НАСТРОЙКА ДАТЧИКОВ И ПАМЯТИ ===
                {% if printer.filament_sensor is defined %}
                    SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=1
                    SET_FILAMENT_SENSOR SENSOR=btt_switch_sensor ENABLE=0
                    M118 Enabling filament sensor
                {% endif %}
                
                SAVE_VARIABLE VARIABLE=ace_last_loaded_slot VALUE={to_index}
            {% endif %}
        {% endif %}
    {% else %}
        # Если слот не задан, выдаем ошибку
        {action_respond_info("Index is lost (TO not defined)")}
        RESPOND TYPE=error MSG="Error INDEX is lost (A_Post_T)"
    {% endif %}
    
    # === 4. ВОЗВРАТ ГОЛОВЫ НА МЕСТО ПЕЧАТИ ===
    RESTORE_GCODE_STATE NAME=TOOLCHANGE MOVE=1 MOVE_SPEED=5000
    M83 ; Гарантируем, что экструдер остался в относительном режиме для слайсера
    M118 Restored GCODE state before Toolchange

[gcode_macro _ACE_ON_EMPTY_ERROR]
gcode:
    #{action_respond_info("Spool is empty")}
    #{% if printer.idle_timeout.state == "Printing" %}
    #    PAUSE
       # TODO: check IS flag and work according it
    #{% endif %}
    M118 ACE: All available spools are empty!
    {% if printer["gcode_macro _QUEUE_STATE"].enabled %}
        M117 Queue: No filament. Ejecting...
        # Сбрасываем недопечатанную деталь, чтобы не мешала следующей (если та из другого материала)
        CLEAR_BED 
        CANCEL_PRINT
    {% else %}
        PAUSE
    {% endif %}
[gcode_macro FEED_ACE]
gcode:
    # Проверяем, задан ли слот
    {% if params.INDEX and params.LENGTH is defined %}
        # Сохраняем заданный слот
        {% set target_index = params.INDEX|int %}
        {% set target_length = params.LENGTH|int %}
        {% if params.SPEED is defined %} 
            {% set target_speed = params.SPEED|int %}
        {% else %}
            {% set target_speed = 25 %}
        {% endif %}
         # Сообщаем о начале парковки
        M118 Feeding slot {target_index}.

        # Запускаем парковку заданного слота
	    ACE_FEED INDEX={target_index} LENGTH={target_length} SPEED={target_speed}

    {% else %}
        # Если слот не задан выдаем ошибку
        {action_respond_info("Index or Length is lost")}
        RESPOND TYPE=error MSG="Error INDEX or LENGTH is lost (F_A)"
    {% endif %}

[gcode_macro RETRACT_ACE]
gcode:
    # Проверяем, задан ли слот
    {% if params.INDEX and params.LENGTH is defined %}
        # Сохраняем заданный слот
        {% set target_index = params.INDEX|int %}
        {% set target_length = params.LENGTH|int %}
        {% if params.SPEED is defined %} 
            {% set target_speed = params.SPEED|int %}
        {% else %}
            {% set target_speed = 25 %}
        {% endif %}
         # Сообщаем о начале парковки
        M118 Retracting slot {target_index}.

        # Запускаем парковку заданного слота
	    ACE_RETRACT INDEX={target_index} LENGTH={target_length} SPEED={target_speed}

    {% else %}
        # Если слот не задан выдаем ошибку
        {action_respond_info("Index or Length is lost")}
        RESPOND TYPE=error MSG="Error INDEX or LENGTH is lost (R_A)"
    {% endif %}

[gcode_macro ENABLE_FEED_ASSIST]
description: Включить поддержку подачи (Укажите Катушку 1-4)
variable_spool: 0
gcode:
    {% set human_spool_param = params.SPOOL|default(params.INDEX|default(-1))|int %}
    
    {% if human_spool_param != -1 %}
        {% set target_index = human_spool_param - 1 %}
    {% else %}
        {% set target_index = printer.save_variables.variables.ace_last_loaded_slot|default(-1)|int %}
    {% endif %}

    {% if target_index >= 0 and target_index <= 3 %}
        M118 Enabling feed assist for Spool {target_index + 1} (System Index: {target_index}).
        
        # === СИНХРОНИЗАЦИЯ: Пишем на диск для Klipper переменных ===
        SAVE_VARIABLE VARIABLE=ace_last_loaded_slot VALUE={target_index}
        SAVE_VARIABLE VARIABLE=ace_current_index VALUE={target_index}
        
        # === СИНХРОНИЗАЦИЯ С PYTHON-ДРАЙВЕРОМ ===
        # Принудительно меняем внутренний статус ValgACE, чтобы он знал, где мы физически
        ACE_SET_CURRENT_INDEX INDEX={target_index}
        
        ACE_ENABLE_FEED_ASSIST INDEX={target_index}
    {% else %}
        {action_respond_info("Spool number is lost or invalid. Use 1, 2, 3 or 4.")}
        RESPOND TYPE=error MSG="Error SPOOL NUMBER is invalid (E_F_A)"
    {% endif %}

[gcode_macro DISABLE_FEED_ASSIST]
description: Выключить поддержку подачи (Укажите Катушку 1-4)
variable_spool: 0
gcode:
    # Принимаем значение из нового поля SPOOL или старого INDEX
    {% set human_spool_param = params.SPOOL|default(params.INDEX|default(-1))|int %}
    {% set current_loaded_slot = printer.save_variables.variables.ace_last_loaded_slot|default(-1)|int %}

    # === СЛУЧАЙ 1: Явно передан номер катушки (SPOOL=1 или INDEX=0) ===
    {% if human_spool_param != -1 %}
        {% set target_index = human_spool_param - 1 if human_spool_param > 0 else human_spool_param %}
        
        {% if target_index >= 0 and target_index <= 3 %}
            # === ЗАЩИТА: Не отключаем текущую активную катушку ===
            {% if target_index == current_loaded_slot %}
                {action_respond_info("WARNING: Cannot disable currently active Spool {human_spool_param}. Use SPOOL=0 to force disable all or specify a different spool.")}
                M118 WARNING: Spool {human_spool_param} is currently active!
            {% else %}
                M118 Disabling feed assist for Spool {human_spool_param} (System Index: {target_index}).
                ACE_DISABLE_FEED_ASSIST INDEX={target_index}
            {% endif %}
        {% else %}
            {action_respond_info("Invalid Spool number: " ~ human_spool_param|string ~ ". Use 1-4 or 0 to disable all.")}
        {% endif %}
        
    # === СЛУЧАЙ 2: Нет параметров - отключаем текущую активную катушку ===
    {% elif current_loaded_slot >= 0 and current_loaded_slot <= 3 %}
        M118 Disabling feed assist for stored Spool {current_loaded_slot + 1}.
        ACE_DISABLE_FEED_ASSIST INDEX={current_loaded_slot}
        
    # === СЛУЧАЙ 3: Ничего не определено - безопасно отключаем все ===
    {% else %}
        {action_respond_info("No spool specified. Disabling feed assist for all slots.")}
        M118 Disabling feed assist for all slots...
        ACE_DISABLE_FEED_ASSIST INDEX=0
        G4 P200
        ACE_DISABLE_FEED_ASSIST INDEX=1
        G4 P200
        ACE_DISABLE_FEED_ASSIST INDEX=2
        G4 P200
        ACE_DISABLE_FEED_ASSIST INDEX=3
        G4 P200
    {% endif %}


[gcode_macro PARK_TO_TOOLHEAD]
description: Припарковать филамент к голове (Укажите Катушку 1-4)
variable_spool: 0
gcode:
    {% set human_spool_param = params.SPOOL|default(params.INDEX|default(-1))|int %}
    
    {% if human_spool_param != -1 %}
        {% set target_index = human_spool_param - 1 %}
    {% else %}
        {% set target_index = printer.save_variables.variables.ace_last_loaded_slot|default(-1)|int %}
    {% endif %}

    {% if target_index >= 0 and target_index <= 3 %}
        # === СИНХРОНИЗАЦИЯ ВСЕХ СТЕМ С РУЧНОЙ ПАРКОВКОЙ ===
        SAVE_VARIABLE VARIABLE=ace_parked_index VALUE={target_index}
        SAVE_VARIABLE VARIABLE=ace_last_loaded_slot VALUE={target_index}
        SAVE_VARIABLE VARIABLE=ace_current_index VALUE={target_index}
        
        # Принудительно синхронизируем внутренний Python-стейт драйвера ValgACE
        ACE_SET_CURRENT_INDEX INDEX={target_index}
        
        M118 Запомнен и сохранен на диск слот ACE: {target_index} (Spool {target_index + 1})
        M118 Parking to toolhead for Spool {target_index + 1}
        ACE_PARK_TO_TOOLHEAD INDEX={target_index}
    {% else %}
        {action_respond_info("Spool number is lost or invalid for PARK_TO_TOOLHEAD. Use 1-4.")}
        RESPOND TYPE=error MSG="Error: SPOOL NUMBER is invalid (P_T_T)"
    {% endif %}

[gcode_macro START_DRYING]
gcode:
    # Проверяем, задана ли температура
    {% if params.TEMP is defined %}
        # Сохраняем заданную температуру
        {% set target_temp = params.TEMP|int %}
    {% else %}
        # Если температура не задана, используем значение по умолчанию (например, 55 градусов)
        {% set target_temp = 55 %}
    {% endif %}
	# Проверяем, задано ли время
    {% if params.TIME is defined %}
        # Сохраняем заданное время в мин.
        {% set target_time = params.TIME|int %}
    {% else %}
        # Если время не задано, используем значение по умолчанию (например, 120 минут)
        {% set target_time = 120 %}
    {% endif %}
	
    # Сообщаем о начале сушки
    M117 Drying at {target_temp}°C for {target_time} mins.

    # Запускаем сушку с заданными параметрами
	ACE_START_DRYING TEMP={target_temp} DURATION={target_time}

[gcode_macro STOP_DRYING]
gcode: 
    ACE_STOP_DRYING
    M117 Drying off, fans are cooling.
    
[gcode_macro SPOOL1]
gcode:
    ACE_CHANGE_TOOL TOOL=0

[gcode_macro SPOOL2]
gcode:
    ACE_CHANGE_TOOL TOOL=1

[gcode_macro SPOOL3]
gcode:
    ACE_CHANGE_TOOL TOOL=2

[gcode_macro SPOOL4]
gcode:
    ACE_CHANGE_TOOL TOOL=3


[gcode_macro DEBUG_SAFE_X]
gcode:
    {% set x_min = printer.toolhead.axis_minimum.x %}
    {% set bed_start = 0 %}
    {% set safe_x = (x_min + bed_start) / 2 %}
    {action_respond_info("x_min = %.2f" % x_min)}
    {action_respond_info("bed_start = %.2f" % bed_start)}
    {action_respond_info("safe_x = %.2f" % safe_x)}
