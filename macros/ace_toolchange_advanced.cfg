# Advanced ACE Toolchange Macros
# These macros handle temperature and printer state intelligently
# Use these to replace the basic _ACE_PRE_TOOLCHANGE and _ACE_POST_TOOLCHANGE

[gcode_macro _ACE_PRE_TOOLCHANGE]
description: Pre-toolchange macro with intelligent temperature handling
variable_extruder_retract_length: 45
variable_extruder_retract_speed: 1800
gcode:
    # Save current state
    SAVE_GCODE_STATE NAME=FILAMENT_CHANGE_STATE
    
    # Check if we're in the middle of a print
    {% if printer.idle_timeout.state == "Printing" %}
        # During print: nozzle should already be hot, just make sure
        M109 S{printer.extruder.target_temp}
    {% else %}
        # Print finished or idle: nozzle is cold
        # Heat to a safe temperature for toolchange (typically PLA/PETG temp)
        {% set safe_temp = 220 %}
        M118 Heating nozzle to {safe_temp}°C for toolchange...
        M109 S{safe_temp}
    {% endif %}
    
    # Disable feed assist for previous slot so ACE stops pushing filament
    # while we retract it from the extruder/hotend below. Then retract
    # filament from the hotend/extruder before the ACE retracts it into
    # the spool. This mirrors the "tip_maker" approach: negative E-moves
    # pull the filament tip out of the nozzle/extruder so old filament
    # isn't left behind to trip the runout sensor or jam the hub when new
    # filament is fed in.
    {% if params.FROM is defined and params.FROM|int != -1 %}
        M118 Disabling feed assist for slot {params.FROM|int}...
        ACE_DISABLE_FEED_ASSIST INDEX={params.FROM|int}

        {% set svv = printer["gcode_macro _ACE_PRE_TOOLCHANGE"] %}
        M118 Retracting filament from extruder for slot {params.FROM|int}...
        G91
        G1 E-{svv.extruder_retract_length} F{svv.extruder_retract_speed}
        G90
    {% endif %}
    
    # If printing, retract and park
    {% if printer.idle_timeout.state == "Printing" %}
        # Park to safe location
        G0 X-8 Y0 F7800
    {% endif %}

[gcode_macro _ACE_POST_TOOLCHANGE]
description: Post-toolchange macro with feed assist
gcode:
    # Enable feed assist for new slot
    {% if params.TO is defined and params.TO|int != -1 %}
        M118 Enabling feed assist for slot {params.TO|int}...
        ACE_ENABLE_FEED_ASSIST INDEX={params.TO|int}
        G4 P500  # Wait for assist to engage
    {% endif %}
    
    # Extrude some filament to verify load
    {% if params.TO is defined and params.TO|int != -1 %}
        {% if printer.idle_timeout.state == "Printing" %}
            # During print: push through remnant
            M118 Pushing remnant through nozzle...
            G91
            G1 E100 F300
            G90
        {% else %}
            # After print: just extrude to verify
            M118 Verifying filament load...
            G91
            G1 E50 F300
            G90
        {% endif %}
    {% endif %}
    
    # Restore previous state if we were printing
    {% if printer.idle_timeout.state == "Printing" %}
        RESTORE_GCODE_STATE NAME=FILAMENT_CHANGE_STATE MOVE=1 MOVE_SPEED=1500
    {% endif %}

[gcode_macro _ACE_PRE_INFINITYSPOOL]
description: Pre-spool-change macro for infinity spool mode (during print)
gcode:
    M118 Spool empty. Blinding Kobra S1 sensors...
    # Disable sensors during spool change to avoid false triggers
    SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=btt_switch_sensor ENABLE=0
    
    # Disable feed assist for current slot
    {% if params.FROM is defined and params.FROM|int != -1 %}
        ACE_DISABLE_FEED_ASSIST INDEX={params.FROM|int}
    {% endif %}

[gcode_macro _ACE_POST_INFINITYSPOOL]
description: Post-spool-change macro for infinity spool mode (during print)
gcode:
    M118 Activating feed assist for slot {params.TO}...
    ACE_ENABLE_FEED_ASSIST INDEX={params.TO}
    G4 P500  # Wait for assist to engage
    
    M118 Pushing remnant (~100mm) through nozzle...
    # Push old filament through to clear nozzle
    G91
    G1 E100 F300
    G90
    
    M118 Push-through success. Re-enabling Kobra S1 sensors...
    # Re-enable sensors now that change is complete
    SET_FILAMENT_SENSOR SENSOR=btt_smartie ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=btt_switch_sensor ENABLE=1

[gcode_macro _ACE_ON_EMPTY_ERROR]
description: Handle empty spool error
gcode:
    M118 ERROR: Slot {params.INDEX} is empty!
    {% if printer.idle_timeout.state == "Printing" %}
        PAUSE
    {% endif %}
